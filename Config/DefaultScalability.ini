; IronManArena scalability = Ultron perf budget (contrib/ultron/perf_budget.md) merged with Vison's realism layer
; (contrib/vison/DefaultScalability_realism.ini, decisions 8:57). Target: RTX 2070 SUPER 8 GB, 1080p, 60 fps.
; Default tier = High (@2) (UArenaGameUserSettings / Settings "Defaults"). Low (@0) and Cinematic (@4) = engine values.
; Per-tier cvars live ONLY here: DefaultEngine.ini no longer pins r.MotionBlurQuality / VolumetricFog / VolumetricCloud
; in [ConsoleVariables], and its [SystemSettings] no longer sets DynamicRes Min/Max, Streaming.PoolSize,
; Shadow.RadiusThreshold or the VolumetricFog grid, so Medium / High / Epic really differ.
; Deliberate differences from engine 5.8 High: r.Lumen.TraceMeshSDFs.Allow=1 (thin walls leak without mesh SDFs),
;   Lumen GI + reflections kept on at Medium (nothing is baked). Hardware Lumen is NOT forced by Epic: it stays on the
;   in-game ray-tracing toggle only.
; Every cvar name was checked against the 5.8 source tree (rg for the TEXT("name") registration) on 2026-10-30;
;   r.Tonemapper.GrainQuantization does not exist in 5.8 and was dropped. FilmGrainTexelSize is not used anywhere.
; GPU ms in contrib/vison/postprocess_realism_notes.md are estimates, never measured.

[AntiAliasingQuality@3]
; Epic
r.TSR.History.R11G11B10=1
r.TSR.History.ScreenPercentage=200  ; Nyquist history (2160p for 1080p out), ~+0.8 ms
r.TSR.History.UpdateQuality=3
r.TSR.ShadingRejection.Flickering=1
r.TSR.ShadingRejection.Flickering.Period=3  ; Nanite city detail at distance
r.TSR.ShadingRejection.Flickering.FrameRateCap=60
r.TSR.RejectionAntiAliasingQuality=2
r.TSR.Resurrection=1
r.TSR.ReprojectionField=1
r.TSR.Velocity.WeightClampingSampleCount=4  ; default
r.DynamicRes.MinScreenPercentage=60
r.DynamicRes.MaxScreenPercentage=100

[AntiAliasingQuality@2]
; High (default)
r.TSR.History.R11G11B10=1
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=2
r.TSR.ShadingRejection.Flickering=1
r.TSR.ShadingRejection.Flickering.Period=2  ; default; 3 ghosts on fast flight
r.TSR.ShadingRejection.Flickering.FrameRateCap=60
r.TSR.RejectionAntiAliasingQuality=1
r.TSR.Resurrection=1
r.TSR.ReprojectionField=1
r.TSR.Velocity.WeightClampingSampleCount=3  ; sharper in flight at 100% history (Epic suggests 2 for competitive)
r.DynamicRes.MinScreenPercentage=67
r.DynamicRes.MaxScreenPercentage=100

[AntiAliasingQuality@1]
; Medium
r.TSR.History.R11G11B10=1
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=1
r.TSR.ShadingRejection.Flickering=1
r.TSR.ShadingRejection.Flickering.Period=2
r.TSR.ShadingRejection.Flickering.FrameRateCap=60
r.TSR.RejectionAntiAliasingQuality=1
r.TSR.Resurrection=1
r.TSR.ReprojectionField=0
r.TSR.Velocity.WeightClampingSampleCount=3
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=85

