[/Script/EngineSettings.GameMapsSettings]
; No .umap is shipped (maps are binary). /Engine/Maps/Entry is an empty engine map;
; AArenaGameMode detects that there is no floor/light and builds the arena at runtime.
; Once you save your own map (e.g. /Game/Maps/Arena), point these at it instead.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/IronManArena.ArenaGameMode

[/Script/Engine.Engine]
; Our settings subclass (FOV, sensitivity, invert Y, four volumes, subtitles, fullscreen toggle).
GameUserSettingsClassName=/Script/IronManArena.ArenaGameUserSettings

[/Script/Engine.AudioSettings]
; Sound classes made by Content/Python/setup_sound_classes.py: SC_Master > SC_SFX / SC_Voice / SC_Music.
; Sounds without a class of their own go to SC_SFX, so the SFX slider covers them.
DefaultSoundClassName=/Game/Audio/Classes/SC_SFX.SC_SFX

[/Script/Engine.RendererSettings]
; ---- REALISM PROFILE (see Docs/REALISM.md). Visuals unverified on the build box (no GPU). ----
; Lumen global illumination + reflections (1 = Lumen), virtual shadow maps, Nanite.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.Nanite.ProjectEnabled=True
; Hardware ray tracing support is compiled in, but OFF at runtime by default; the settings
; menu "Ray tracing" toggle flips r.RayTracing.Enable + r.Lumen.HardwareRayTracing on demand.
r.RayTracing=True
r.RayTracing.EnableOnDemand=1
r.RayTracing.Enable=0
r.Lumen.HardwareRayTracing=False
r.Lumen.HardwareRayTracing.LightingMode=0
r.RayTracing.Shadows=False
r.SkinCache.CompileShaders=True
; Temporal Super Resolution.
r.AntiAliasingMethod=4
; Substrate materials (default for new 5.7+ projects; legacy shading models such as Clear
; Coat are converted automatically). Blendable GBuffer format.
r.Substrate=True
r.Substrate.ProjectGBufferFormat=1
; Physically based camera: histogram auto-exposure with the extended (EV100) range, filmic
; tonemapper (the ACES-style default), bloom, motion blur, lens flares.
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.AutoExposure.Bias=1.0
r.DefaultFeature.Bloom=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.LensFlare=True
; Sky atmosphere, height fog driven by it, volumetric fog, local fog volumes.
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.SupportLocalFogVolumes=True
r.VolumetricFog.LightFunction=True
r.Shadow.TranslucentPerObject.ProjectEnabled=True

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
; Vulkan SM6 is required for Lumen/Nanite/VSM/ray tracing on Linux.
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[ConsoleVariables]
r.MotionBlurQuality=4
r.VolumetricFog=1
r.VolumetricCloud=1
