[/Script/Engine.InputSettings]
; Enhanced Input is the default in UE 5.1+, set explicitly to be safe.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
; F11 and Alt+Enter are handled by AArenaPlayerController (through UArenaGameUserSettings so the
; choice is saved); the engine's built-in toggles are off so they cannot double-toggle.
bAltEnterTogglesFullscreen=False
bF11TogglesFullscreen=False
